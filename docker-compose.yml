version: '3.8'

services:
  db:
    image: postgres:15
    container_name: diary_db
    environment:
      POSTGRES_DB: diary_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: diary_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: diary_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_NAME: diary_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DEBUG: "True"

  nginx:
    image: nginx:alpine
    container_name: diary_nginx
    ports:
      - "80:80"
    volumes:
      - ./src/static:/app/static
      - ./src/media:/app/media
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
