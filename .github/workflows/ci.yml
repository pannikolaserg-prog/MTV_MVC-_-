name: CI/CD

on:
  push:
    branches: [ main, diploma-project ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diary_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd src
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd src
          python manage.py migrate
        env:
          DB_NAME: diary_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SETTINGS_MODULE: core.settings

      - name: Run tests
        run: |
          cd src
          python manage.py test --verbosity=2
        env:
          DB_NAME: diary_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SETTINGS_MODULE: core.settings

      - name: Run coverage
        run: |
          cd src
          pip install coverage
          coverage run --source='apps' manage.py test
          coverage report -m
        env:
          DB_NAME: diary_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SETTINGS_MODULE: core.settings

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t diary-app .

      - name: Run container
        run: |
          docker run -d --name diary-test -p 8000:8000 diary-app
          sleep 10

      - name: Check container logs
        run: docker logs diary-test

      - name: Test health check
        run: curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ || echo "Container may not be ready"

      - name: Clean up
        run: docker stop diary-test && docker rm diary-test
